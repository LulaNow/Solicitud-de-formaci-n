services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: instancia_sso
    restart: unless-stopped
    ports:
      - "8000:3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    networks:
      - default
      - nginx-proxy-manager
    command: node server.js

networks:
  nginx-proxy-manager:
    external: true
